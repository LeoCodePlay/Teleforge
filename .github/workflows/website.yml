name: Website (GitHub Pages)

# 官网是纯静态站点(website/ 下一整套,与桌面端打包无关)。
# 推 main 且改动落在 website/ 或本工作流时,自动构建并发布到 GitHub Pages。

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_ready: ${{ steps.availability.outputs.enabled }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json

      # 项目页是 https://<owner>.github.io/<repo>/,必须在构建时把子路径传给 Next;
      # 若仓库本身叫 <owner>.github.io(用户页),则站点在根路径上,不加前缀。
      - name: 解析部署路径
        id: path
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          if [[ "$REPO" == *.github.io ]]; then
            BASE_PATH=""
          else
            BASE_PATH="/$REPO"
          fi
          echo "base_path=$BASE_PATH" >> "$GITHUB_OUTPUT"
          echo "site_url=https://${GITHUB_REPOSITORY_OWNER}.github.io" >> "$GITHUB_OUTPUT"
          echo "站点地址: https://${GITHUB_REPOSITORY_OWNER}.github.io${BASE_PATH}/"

      # GITHUB_TOKEN 没有创建 Pages 站点的权限(需要 PAT 或管理员在设置里开),
      # 所以这里先探一下:没开就跳过部署并给出明确提示,不让工作流变红。
      - name: 检查 GitHub Pages 是否已开启
        id: availability
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          if [[ "$code" == "200" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=GitHub Pages 尚未开启::仓库管理员打开 Settings → Pages,把 Source 设为 \"GitHub Actions\",然后重新运行本工作流即可发布(站点已构建完成,产物见下方 artifact)。"
          fi

      - name: 安装依赖并构建静态站点
        working-directory: website
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.path.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.path.outputs.site_url }}
        run: |
          npm ci
          npm run typecheck
          npm run build
          test -f out/index.html
          test -f out/.nojekyll
          echo "产物文件数:$(find out -type f | wc -l)"

      - name: 上传产物(始终上传,便于排查)
        uses: actions/upload-artifact@v7
        with:
          name: website-out
          path: website/out
          retention-days: 7

      - name: 上传 Pages 产物
        if: steps.availability.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/out

  deploy:
    needs: build
    if: needs.build.outputs.pages_ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
