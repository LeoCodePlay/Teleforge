# 桌面端三平台构建:每次打 v* 标签或手动触发,产出 Windows/macOS/Linux 安装包
name: desktop-build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: windows-latest, bundles: "nsis",  artifact: "teleforge-windows-x64" }
          - { platform: macos-14,       bundles: "dmg",   artifact: "teleforge-macos-arm64" }
          - { platform: macos-13,       bundles: "dmg",   artifact: "teleforge-macos-x64" }
          - { platform: ubuntu-22.04,   bundles: "deb,appimage", artifact: "teleforge-linux-x64" }
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 file

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # 平台本地安装:拿到该平台正确的 node-pty 预编译/编译产物
      - name: Install dependencies
        run: npm ci

      # beforeBuildCommand 会自动执行 npm run build + node scripts/build.mjs(下载 Node 运行时、拷贝 server/web/dist、staging 安装生产依赖)
      - name: Build desktop bundle
        run: npx tauri build --bundles ${{ matrix.bundles }}
        env:
          NO_STRIP: "true" # AppImage 构建需要

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
