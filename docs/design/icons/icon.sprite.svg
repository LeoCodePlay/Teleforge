<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <!-- Teleforge 图标 sprite · 单一真源是 web/src/components/icons/icons.tsx
       用法:<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6"
                 stroke-linecap="round" stroke-linejoin="round"><use href="icon.sprite.svg#i-cloud-16"/></svg>
       (跨文件 <use> 只在 http(s) 下可靠;file:// 直接打开请改用 icon-preview.html,那份是内联的)
